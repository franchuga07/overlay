<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Juego (reproductor vía Last.fm) · franchu_ga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Fondo TRANSPARENTE: pon esta fuente encima del juego en OBS (1920x1080).
   El contador de subs (arriba a la izquierda) es el widget de StreamElements "meta-subs". */
:root{--morado:#8b5cf6;--lila:#c4b5fd;--rosa:#e879f9;--texto:#f5f3ff;--suave:#a79bd0;
  --acento:#a78bfa;--acento-suave:rgba(167,139,250,.45);--acento-claro:#ddd6fe}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:Inter,system-ui,sans-serif;color:var(--texto)}

/* ---------- Reproductor (arriba a la derecha) ---------- */
#musica{position:absolute;top:38px;right:38px;width:600px;height:132px;display:flex;align-items:center;gap:18px;padding:14px;
  background:#000;border:3px solid var(--acento);border-radius:18px;box-shadow:0 0 28px var(--acento-suave);
  transition:opacity .6s,transform .6s cubic-bezier(.2,1.2,.3,1),border-color 1.2s,box-shadow 1.2s}
#musica.oculto{opacity:0;transform:translateX(120px)}
.disco-zona{position:relative;flex:0 0 156px;height:104px}
.portada{position:absolute;left:0;top:0;width:104px;height:104px;border-radius:10px;overflow:hidden;background:#1a1030;z-index:2;
  box-shadow:6px 0 14px rgba(0,0,0,.7)}
.portada img{width:100%;height:100%;object-fit:cover;display:block}
/* Vinilo medio salido de la portada */
.vinilo{position:absolute;top:3px;left:52px;width:98px;height:98px;border-radius:50%;z-index:1;
  background:
    radial-gradient(circle,transparent 0 31%,rgba(0,0,0,0) 31%),
    repeating-radial-gradient(circle,#1e1e24 0 1.5px,#34343c 1.5px 3px),
    #1e1e24;
  box-shadow:0 0 0 2px var(--acento),0 0 14px var(--acento-suave);
  animation:girar 2.4s linear infinite, salir .9s cubic-bezier(.2,1,.3,1)}
.vinilo::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 20deg,transparent 0 10%,rgba(255,255,255,.28) 14%,transparent 20% 55%,rgba(255,255,255,.2) 60%,transparent 66%)}
.vinilo .etiqueta{position:absolute;inset:32%;border-radius:50%;overflow:hidden;background:var(--acento)}
.vinilo .etiqueta img{width:100%;height:100%;object-fit:cover}
.vinilo .etiqueta::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#000}
#musica.pausa .vinilo{animation-play-state:paused}
#musica.pausa .vinilo{left:18px}
.vinilo{transition:left .8s cubic-bezier(.2,1,.3,1),box-shadow 1.2s}
#musica.pausa .portada img,#musica.pausa .vinilo .etiqueta img{filter:grayscale(.8) brightness(.6)}
#musica.pausa .cancion,#musica.pausa .artista{opacity:.6}
@keyframes girar{to{transform:rotate(360deg)}}
@keyframes salir{from{left:4px}to{left:52px}}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cabecera{display:flex;align-items:center;gap:8px;font:700 14px 'Chakra Petch',sans-serif;letter-spacing:3px;color:var(--acento-claro);text-transform:uppercase;transition:color 1.2s}
.ondas{display:flex;align-items:flex-end;gap:3px;height:14px}
.ondas i{width:3px;background:var(--acento);border-radius:2px;animation:onda .9s ease-in-out infinite}
.ondas i:nth-child(2){animation-delay:-.3s}.ondas i:nth-child(3){animation-delay:-.6s}.ondas i:nth-child(4){animation-delay:-.15s}
#musica.pausa .ondas i{animation:none;height:3px}
@keyframes onda{0%,100%{height:3px}50%{height:14px}}
.cancion,.artista{white-space:nowrap;overflow:hidden}
.cancion{font:700 26px/1.2 'Chakra Petch',sans-serif}
.artista{font-size:18px;color:var(--suave)}
.cancion > span,.artista > span{display:inline-block}
/* Cinta infinita: el texto va duplicado y avanza siempre hacia la izquierda */
.cinta > span{animation:cinta var(--dur,10s) linear infinite}
.cinta > span i{font-style:normal;padding-right:70px}
@keyframes cinta{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.barra{height:5px;border-radius:3px;background:rgba(196,181,253,.18);margin-top:6px;overflow:hidden}
.barra div{height:100%;width:0;background:linear-gradient(90deg,var(--morado),var(--rosa));transition:width 1s linear}
#depurar{position:absolute;left:40px;bottom:40px;max-width:900px;padding:14px 20px;border-radius:12px;background:rgba(0,0,0,.85);
  border:2px solid #f59e0b;color:#fde68a;font:600 22px/1.4 Inter,sans-serif;display:none}

/* ---------- Chat de Twitch (abajo a la izquierda) ---------- */
#chat{position:absolute;left:44px;bottom:26px;width:540px;height:250px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;
  overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22%);mask-image:linear-gradient(to bottom,transparent 0,#000 22%)}
.msg{flex:none;background:rgba(0,0,0,.88);border:2px solid var(--acento);border-radius:14px;padding:8px 14px;
  box-shadow:0 0 14px var(--acento-suave);color:var(--texto);font-size:19px;line-height:1.35;word-wrap:break-word;
  transition:border-color 1.2s,box-shadow 1.2s;animation:msgEntra .45s cubic-bezier(.2,1.3,.4,1) both}
.msg.sale{animation:msgSale .4s forwards}
.msg .quien{font:700 17px 'Chakra Petch',sans-serif;color:var(--acento-claro);margin-right:8px;transition:color 1.2s}
.msg .quien .ins{font-size:14px;margin-right:4px}
.msg img.emote{height:28px;vertical-align:middle;margin:-4px 1px}
.msg.mencion{background:color-mix(in srgb,var(--acento) 30%,#000)}
@keyframes msgEntra{from{opacity:0;transform:translateX(-40px) scale(.95)}to{opacity:1;transform:none}}
@keyframes msgSale{to{opacity:0;transform:translateX(-40px)}}
</style>
</head>
<body>

<div id="musica" class="oculto">
  <div class="disco-zona">
    <div class="vinilo" id="vinilo"><div class="etiqueta"><img id="etiqueta" alt=""></div></div>
    <div class="portada"><img id="portada" alt=""></div>
  </div>
  <div class="info">
    <div class="cabecera"><div class="ondas"><i></i><i></i><i></i><i></i></div><span id="estado">Sonando ahora</span></div>
    <div class="cancion" id="cancion"><span></span></div>
    <div class="artista" id="artista"><span></span></div>
    
  </div>
</div>

<div id="chat"></div>
<div id="depurar"></div>

<script>
/* ===== CONFIGURACIÓN =====
   1. En Cider: Ajustes → Conexiones → activa el scrobbling de Last.fm e inicia sesión.
   2. Crea una API key gratis en https://www.last.fm/api/account/create
   3. Rellena estas dos líneas: */
const LASTFM_USUARIO = "XERRUG";   // tu nombre de usuario de Last.fm
const LASTFM_API_KEY = "b3736756a13f3e161f42327a3a1d6d6f";   // la "API key" (NO el "shared secret")

const CADA_MS = 8000;        // cada cuánto mira qué suena
const DEPURAR = false;        // true = muestra abajo a la izquierda qué falla. Cuando funcione, ponlo en false.

const $ = (id) => document.getElementById(id);
let ultimaCancion = "", duracionMs = 0, inicioCancion = 0, estabaParado = false;
const MARGEN_MS = 20000;   // tiempo extra antes de dar la canción por pausada

function aviso(texto){
  const el = $('depurar');
  if (!DEPURAR || !texto){ el.style.display = 'none'; return; }
  el.style.display = 'block'; el.textContent = '⚠ ' + texto;
}

function ponerTexto(el, texto){
  if (el.dataset.texto === texto) return;
  el.dataset.texto = texto;
  const span = el.querySelector('span');
  el.classList.remove('cinta');
  span.textContent = texto;
  requestAnimationFrame(() => {
    if (span.scrollWidth <= el.clientWidth) return;     // cabe: se queda quieto
    const seguro = texto.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    span.innerHTML = `<i>${seguro}</i><i>${seguro}</i>`; // dos copias seguidas = vuelta infinita sin saltos
    const ancho = span.scrollWidth / 2;
    el.style.setProperty('--dur', `${Math.max(6, ancho / 45)}s`); // ~45 px por segundo
    el.classList.add('cinta');
  });
}

/* Portada en buena calidad desde Apple Music (búsqueda pública de iTunes, vía JSONP) */
function portadaApple(cancion, artista){
  return new Promise((resolver) => {
    const cb = 'itunes_' + Date.now();
    const s = document.createElement('script');
    const fin = (url, dur = 0) => { delete window[cb]; s.remove(); resolver({ url, dur }); };
    window[cb] = (r) => {
      const t = r && r.results && r.results[0];
      fin(t && t.artworkUrl100 ? t.artworkUrl100.replace('100x100bb', '600x600bb') : '', (t && t.trackTimeMillis) || 0);
    };
    s.onerror = () => fin('');
    setTimeout(() => window[cb] && fin(''), 5000);
    s.src = 'https://itunes.apple.com/search?entity=song&limit=1&country=es&callback=' + cb +
            '&term=' + encodeURIComponent(artista + ' ' + cancion);
    document.body.appendChild(s);
  });
}

async function actualizar(){
  const caja = $('musica');
  if (!LASTFM_USUARIO || !LASTFM_API_KEY){
    parado();
    aviso('Falta poner tu usuario y tu API key de Last.fm en el archivo (líneas LASTFM_USUARIO y LASTFM_API_KEY).');
    return;
  }
  try {
    const url = 'https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&limit=1&format=json' +
                '&user=' + encodeURIComponent(LASTFM_USUARIO) + '&api_key=' + encodeURIComponent(LASTFM_API_KEY);
    const j = await (await fetch(url, { cache: 'no-store' })).json();
    if (j.error){ parado(); aviso('Last.fm dice: ' + j.message + ' (revisa el usuario y la API key).'); return; }

    const lista = j.recenttracks && j.recenttracks.track;
    const t = Array.isArray(lista) ? lista[0] : lista;
    const sonando = t && t['@attr'] && t['@attr'].nowplaying === 'true';
    if (!sonando){
      parado();
      aviso('Conectado con Last.fm, pero ahora mismo no marca nada sonando. Pon música en Cider y comprueba que el scrobbling está activado.');
      return;
    }

    const cancion = t.name, artista = (t.artist && (t.artist['#text'] || t.artist.name)) || '';
    const id = cancion + '|' + artista;
    if (id !== ultimaCancion){
      ultimaCancion = id;
      const apple = await portadaApple(cancion, artista);
      let portada = apple.url;
      duracionMs = apple.dur; inicioCancion = Date.now();
      if (!portada){
        const imgs = t.image || [];
        portada = (imgs[imgs.length - 1] || {})['#text'] || '';
        if (portada.includes('2a96cbd8b46e442fc41c2b86b821562f')) portada = ''; // estrella gris = sin portada
      }
      const img = portada || SIN_PORTADA;
      $('portada').src = img; $('etiqueta').src = img;
      if (portada) colorDePortada(portada); else ponerAcento();
      const v = $('vinilo'); v.style.animation = 'none'; void v.offsetWidth; v.style.animation = '';
    }
    if (estabaParado){ inicioCancion = Date.now(); estabaParado = false; } // vuelve a sonar tras una pausa
    ponerTexto($('cancion'), cancion);
    ponerTexto($('artista'), artista);
    caja.classList.remove('oculto');
    const pasada = duracionMs && (Date.now() - inicioCancion > duracionMs + MARGEN_MS);
    caja.classList.toggle('pausa', !!pasada);
    $('estado').textContent = pasada ? 'En pausa' : 'Sonando ahora';
    aviso('');
  } catch (e) {
    parado();
    aviso('No consigo conectar con Last.fm. ¿Hay internet?');
  }
}


/* Estado "sin música": el reproductor se queda visible pero parado */
const SIN_PORTADA = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2a1650"/><text x="50" y="66" font-size="48" text-anchor="middle">🎵</text></svg>');
function parado(){
  const caja = $('musica');
  caja.classList.remove('oculto');
  caja.classList.add('pausa');
  estabaParado = true;
  $('estado').textContent = ultimaCancion ? 'En pausa' : 'Sin música';
  if (!ultimaCancion){                       // nunca ha sonado nada todavía
    $('portada').src = SIN_PORTADA; $('etiqueta').src = SIN_PORTADA;
    ponerTexto($('cancion'), 'Nada sonando');
    ponerTexto($('artista'), 'Pon algo de música 🎧');
  }
}

/* Color del borde según la portada */
function colorDePortada(url){
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    try {
      const c = document.createElement('canvas'); c.width = c.height = 32;
      const x = c.getContext('2d'); x.drawImage(img, 0, 0, 32, 32);
      const d = x.getImageData(0, 0, 32, 32).data;
      let r = 0, g = 0, b = 0, peso = 0;
      for (let i = 0; i < d.length; i += 4){
        const R = d[i], G = d[i+1], B = d[i+2];
        const max = Math.max(R, G, B), min = Math.min(R, G, B);
        const sat = max ? (max - min) / max : 0, luz = max / 255;
        const w = Math.pow(sat, 2) * (luz > .15 ? 1 : .1) + .002;  // premia los colores vivos
        r += R * w; g += G * w; b += B * w; peso += w;
      }
      ponerAcento(r / peso, g / peso, b / peso);
    } catch (_) { ponerAcento(); }
  };
  img.onerror = () => ponerAcento();
  img.src = url;
}
function ponerAcento(r, g, b){
  const caja = document.documentElement;   // el color se aplica a todo: reproductor y chat
  if (r === undefined){ caja.style.removeProperty('--acento'); caja.style.removeProperty('--acento-suave'); caja.style.removeProperty('--acento-claro'); return; }
  // a HSL para que el color siempre se vea bien sobre negro
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
  let h = 0, s = 0;
  if (max !== min){
    const d = max - min; s = l > .5 ? d / (2 - max - min) : d / (max + min);
    h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60;
  }
  if (s < .12){ ponerAcento(); return; }      // portada en blanco y negro → lila de siempre
  const S = Math.max(s, .65) * 100;
  caja.style.setProperty('--acento', `hsl(${h} ${S}% 62%)`);
  caja.style.setProperty('--acento-suave', `hsl(${h} ${S}% 55% / .45)`);
  caja.style.setProperty('--acento-claro', `hsl(${h} ${S}% 85%)`);
}

aviso('Conectando con Last.fm…');
actualizar();
setInterval(actualizar, CADA_MS);

/* =====================================================================
   CHAT DE TWITCH (solo lectura, sin contraseña)
   ===================================================================== */
const CANAL_TWITCH = "franchu_ga";
const CHAT_MAX = 6;                                  // mensajes como máximo en pantalla
const CHAT_OCULTAR_TRAS = 0;                         // segundos hasta que un mensaje desaparece (0 = nunca)
const CHAT_BOTS = ["streamelements", "nightbot", "moobot", "streamlabs"];
const CHAT_OCULTAR_COMANDOS = true;                  // ocultar mensajes que empiezan por "!"

const escaparHTML = (t) => t.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function leerTags(raw){
  const tags = {};
  raw.split(';').forEach((p) => { const i = p.indexOf('='); tags[p.slice(0, i)] = p.slice(i + 1).replace(/\\s/g, ' '); });
  return tags;
}

// Sustituye los emotes de Twitch por sus imágenes
function textoConEmotes(texto, emotesTag){
  const letras = Array.from(texto);              // Twitch cuenta por caracteres Unicode
  if (!emotesTag) return escaparHTML(texto);
  const trozos = [];
  emotesTag.split('/').forEach((e) => {
    const [id, pos] = e.split(':');
    pos.split(',').forEach((r) => { const [a, b] = r.split('-').map(Number); trozos.push({ id, a, b }); });
  });
  trozos.sort((x, y) => x.a - y.a);
  let html = '', i = 0;
  for (const t of trozos){
    html += escaparHTML(letras.slice(i, t.a).join(''));
    html += `<img class="emote" src="https://static-cdn.jtvnw.net/emoticons/v2/${t.id}/default/dark/2.0" alt="">`;
    i = t.b + 1;
  }
  return html + escaparHTML(letras.slice(i).join(''));
}

function insignias(badges){
  let s = '';
  if (/broadcaster/.test(badges)) s += '🎥';
  else if (/moderator/.test(badges)) s += '🛡️';
  if (/vip/.test(badges)) s += '💎';
  if (/subscriber|founder/.test(badges)) s += '⭐';
  return s ? `<span class="ins">${s}</span>` : '';
}

function añadirMensaje({ id, usuario, nombre, html, mencion }){
  const chat = $('chat');
  const el = document.createElement('div');
  el.className = 'msg' + (mencion ? ' mencion' : '');
  el.dataset.id = id || ''; el.dataset.usuario = usuario;
  el.innerHTML = `<span class="quien">${nombre}</span>${html}`;
  chat.appendChild(el);
  while (chat.children.length > CHAT_MAX) chat.firstElementChild.remove();
  if (CHAT_OCULTAR_TRAS > 0) setTimeout(() => { el.classList.add('sale'); setTimeout(() => el.remove(), 400); }, CHAT_OCULTAR_TRAS * 1000);
}

function procesarIRC(linea){
  let tags = {}, resto = linea;
  if (resto.startsWith('@')){ const sp = resto.indexOf(' '); tags = leerTags(resto.slice(1, sp)); resto = resto.slice(sp + 1); }

  const m = resto.match(/^:(\w+)!\S+ PRIVMSG #\w+ :(.*)$/);
  if (m){
    const usuario = m[1].toLowerCase(); let texto = m[2];
    if (texto.startsWith('\u0001ACTION ')) texto = texto.slice(8, -1);   // mensajes /me
    if (CHAT_BOTS.includes(usuario)) return;
    if (CHAT_OCULTAR_COMANDOS && texto.startsWith('!')) return;
    añadirMensaje({
      id: tags.id, usuario,
      nombre: insignias(tags.badges || '') + escaparHTML(tags['display-name'] || usuario),
      html: textoConEmotes(texto, tags.emotes),
      mencion: texto.toLowerCase().includes('@' + CANAL_TWITCH.toLowerCase())
    });
    return;
  }
  // Moderación: mensaje borrado, usuario baneado/timeout o chat limpiado
  if (/ CLEARMSG /.test(resto) && tags['target-msg-id']) document.querySelectorAll(`#chat .msg[data-id="${tags['target-msg-id']}"]`).forEach((e) => e.remove());
  const cc = resto.match(/ CLEARCHAT #\w+(?: :(\w+))?/);
  if (cc){
    if (cc[1]) document.querySelectorAll(`#chat .msg[data-usuario="${cc[1].toLowerCase()}"]`).forEach((e) => e.remove());
    else $('chat').innerHTML = '';
  }
}

function conectarChat(){
  const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  ws.onopen = () => {
    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    ws.send('NICK justinfan' + Math.floor(10000 + Math.random() * 80000));   // usuario anónimo de solo lectura
    ws.send('JOIN #' + CANAL_TWITCH.toLowerCase());
  };
  ws.onmessage = (e) => e.data.split('\r\n').forEach((l) => {
    if (!l) return;
    if (l.startsWith('PING')) ws.send('PONG :tmi.twitch.tv'); else procesarIRC(l);
  });
  ws.onclose = () => setTimeout(conectarChat, 3000);     // se reconecta solo
}
conectarChat();
</script>
</body>
</html>

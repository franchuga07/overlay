<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Juego (reproductor vía Last.fm) · franchu_ga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Fondo TRANSPARENTE: pon esta fuente encima del juego en OBS (1920x1080).
   El contador de subs (arriba a la izquierda) es el widget de StreamElements "meta-subs". */
:root{--morado:#8b5cf6;--lila:#c4b5fd;--rosa:#e879f9;--texto:#f5f3ff;--suave:#a79bd0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:Inter,system-ui,sans-serif;color:var(--texto)}

/* ---------- Reproductor (arriba a la derecha) ---------- */
#musica{position:absolute;top:38px;right:38px;width:520px;height:132px;display:flex;align-items:center;gap:18px;padding:14px;
  background:#000;border:3px solid var(--morado);border-radius:18px;box-shadow:0 0 28px rgba(139,92,246,.45);
  transition:opacity .6s,transform .6s cubic-bezier(.2,1.2,.3,1)}
#musica.oculto{opacity:0;transform:translateX(120px)}
.portada{position:relative;flex:0 0 100px;height:100px;border-radius:12px;overflow:hidden;background:#1a1030}
.portada img{width:100%;height:100%;object-fit:cover;display:block}
#musica.pausa .portada img{filter:grayscale(.8) brightness(.6)}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cabecera{display:flex;align-items:center;gap:8px;font:700 14px 'Chakra Petch',sans-serif;letter-spacing:3px;color:var(--lila);text-transform:uppercase}
.ondas{display:flex;align-items:flex-end;gap:3px;height:14px}
.ondas i{width:3px;background:var(--rosa);border-radius:2px;animation:onda .9s ease-in-out infinite}
.ondas i:nth-child(2){animation-delay:-.3s}.ondas i:nth-child(3){animation-delay:-.6s}.ondas i:nth-child(4){animation-delay:-.15s}
#musica.pausa .ondas i{animation:none;height:3px}
@keyframes onda{0%,100%{height:3px}50%{height:14px}}
.cancion,.artista{white-space:nowrap;overflow:hidden}
.cancion{font:700 26px/1.2 'Chakra Petch',sans-serif}
.artista{font-size:18px;color:var(--suave)}
.cancion span,.artista span{display:inline-block;padding-right:60px}
.desliza span{animation:deslizar var(--dur,10s) linear infinite}
@keyframes deslizar{0%,15%{transform:translateX(0)}85%,100%{transform:translateX(var(--dist))}}
.barra{height:5px;border-radius:3px;background:rgba(196,181,253,.18);margin-top:6px;overflow:hidden}
.barra div{height:100%;width:0;background:linear-gradient(90deg,var(--morado),var(--rosa));transition:width 1s linear}
#depurar{position:absolute;left:40px;bottom:40px;max-width:900px;padding:14px 20px;border-radius:12px;background:rgba(0,0,0,.85);
  border:2px solid #f59e0b;color:#fde68a;font:600 22px/1.4 Inter,sans-serif;display:none}
</style>
</head>
<body>

<div id="musica" class="oculto">
  <div class="portada"><img id="portada" alt=""></div>
  <div class="info">
    <div class="cabecera"><div class="ondas"><i></i><i></i><i></i><i></i></div><span id="estado">Sonando ahora</span></div>
    <div class="cancion" id="cancion"><span></span></div>
    <div class="artista" id="artista"><span></span></div>
    
  </div>
</div>

<div id="depurar"></div>

<script>
/* ===== CONFIGURACIÓN =====
   1. En Cider: Ajustes → Conexiones → activa el scrobbling de Last.fm e inicia sesión.
   2. Crea una API key gratis en https://www.last.fm/api/account/create
   3. Rellena estas dos líneas: */
const LASTFM_USUARIO = "XERRUG";   // tu nombre de usuario de Last.fm
const LASTFM_API_KEY = "b3736756a13f3e161f42327a3a1d6d6f";   // la "API key" (NO el "shared secret")

const CADA_MS = 8000;        // cada cuánto mira qué suena
const DEPURAR = true;        // true = muestra abajo a la izquierda qué falla. Cuando funcione, ponlo en false.

const $ = (id) => document.getElementById(id);
let ultimaCancion = "";

function aviso(texto){
  const el = $('depurar');
  if (!DEPURAR || !texto){ el.style.display = 'none'; return; }
  el.style.display = 'block'; el.textContent = '⚠ ' + texto;
}

function ponerTexto(el, texto){
  const span = el.querySelector('span');
  if (span.textContent === texto) return;
  span.textContent = texto;
  el.classList.remove('desliza');
  requestAnimationFrame(() => {
    const sobra = span.scrollWidth - el.clientWidth;
    if (sobra > 0){                       // si no cabe, el texto se desliza
      el.style.setProperty('--dist', `-${sobra + 10}px`);
      el.style.setProperty('--dur', `${Math.max(8, sobra / 25)}s`);
      el.classList.add('desliza');
    }
  });
}

/* Portada en buena calidad desde Apple Music (búsqueda pública de iTunes, vía JSONP) */
function portadaApple(cancion, artista){
  return new Promise((resolver) => {
    const cb = 'itunes_' + Date.now();
    const s = document.createElement('script');
    const fin = (url) => { delete window[cb]; s.remove(); resolver(url); };
    window[cb] = (r) => {
      const t = r && r.results && r.results[0];
      fin(t && t.artworkUrl100 ? t.artworkUrl100.replace('100x100bb', '600x600bb') : '');
    };
    s.onerror = () => fin('');
    setTimeout(() => window[cb] && fin(''), 5000);
    s.src = 'https://itunes.apple.com/search?entity=song&limit=1&country=es&callback=' + cb +
            '&term=' + encodeURIComponent(artista + ' ' + cancion);
    document.body.appendChild(s);
  });
}

async function actualizar(){
  const caja = $('musica');
  if (!LASTFM_USUARIO || !LASTFM_API_KEY){
    caja.classList.add('oculto');
    aviso('Falta poner tu usuario y tu API key de Last.fm en el archivo (líneas LASTFM_USUARIO y LASTFM_API_KEY).');
    return;
  }
  try {
    const url = 'https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&limit=1&format=json' +
                '&user=' + encodeURIComponent(LASTFM_USUARIO) + '&api_key=' + encodeURIComponent(LASTFM_API_KEY);
    const j = await (await fetch(url, { cache: 'no-store' })).json();
    if (j.error){ caja.classList.add('oculto'); aviso('Last.fm dice: ' + j.message + ' (revisa el usuario y la API key).'); return; }

    const lista = j.recenttracks && j.recenttracks.track;
    const t = Array.isArray(lista) ? lista[0] : lista;
    const sonando = t && t['@attr'] && t['@attr'].nowplaying === 'true';
    if (!sonando){
      caja.classList.add('oculto');
      aviso('Conectado con Last.fm, pero ahora mismo no marca nada sonando. Pon música en Cider y comprueba que el scrobbling está activado.');
      return;
    }

    const cancion = t.name, artista = (t.artist && (t.artist['#text'] || t.artist.name)) || '';
    const id = cancion + '|' + artista;
    if (id !== ultimaCancion){
      ultimaCancion = id;
      let portada = await portadaApple(cancion, artista);
      if (!portada){
        const imgs = t.image || [];
        portada = (imgs[imgs.length - 1] || {})['#text'] || '';
        if (portada.includes('2a96cbd8b46e442fc41c2b86b821562f')) portada = ''; // estrella gris = sin portada
      }
      $('portada').src = portada || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2a1650"/><text x="50" y="66" font-size="48" text-anchor="middle">🎵</text></svg>');
    }
    ponerTexto($('cancion'), cancion);
    ponerTexto($('artista'), artista);
    caja.classList.remove('pausa', 'oculto');
    aviso('');
  } catch (e) {
    caja.classList.add('oculto');
    aviso('No consigo conectar con Last.fm. ¿Hay internet?');
  }
}

aviso('Conectando con Last.fm…');
actualizar();
setInterval(actualizar, CADA_MS);
</script>
</body>
</html>
